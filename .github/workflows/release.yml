name: Release

# Builds, checksums, attests, and attaches archives to the GitHub Release of THIS
# repository (${{ github.repository }}), from an existing vX.Y.Z tag only.
#
#   push of a tag v*          -> releases that tag
#   workflow_dispatch + tag   -> releases that already-pushed tag (re-run, or when the
#                                tag push did not start a run):
#                                gh workflow run release.yml -f tag=vX.Y.Z
#
# Either way the tag must match ^v[0-9]+\.[0-9]+\.[0-9]+$ and exist on origin, and every
# job checks out refs/tags/<tag>, never the branch the run was started from.
# Phase B (the human real-consequence run, docs/REHEARSAL.md) cannot be automated, so
# `bicz release-gate` is not run here and every release is published as a PRE-RELEASE
# carrying no behavioral-effect claim. After a human has recorded Phase B evidence and
# `bicz release-gate` passes locally, remove --prerelease below.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          # Untrusted input goes through env, never interpolated into the script.
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag '$TAG' does not match ^v[0-9]+\.[0-9]+\.[0-9]+$" >&2
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/$REPO" "refs/tags/$TAG" >/dev/null; then
            echo "tag '$TAG' does not exist on $REPO; push it first" >&2
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run ./cmd/bicz rehearsal --json --db "$RUNNER_TEMP/rehearsal" --record "$RUNNER_TEMP/rehearsal.json" > /dev/null

  build:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archives and SHA256SUMS
        run: scripts/build_release.sh "$TAG" dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Smoke the linux/amd64 archive
        run: |
          mkdir -p "$RUNNER_TEMP/x"
          tar -xzf dist/bicz_linux_amd64.tar.gz -C "$RUNNER_TEMP/x"
          "$RUNNER_TEMP/x/bicz" version | tee "$RUNNER_TEMP/version.txt"
          grep -q "$TAG" "$RUNNER_TEMP/version.txt"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/bicz_*.tar.gz
            dist/bicz_*.zip
            dist/SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          v="${TAG#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no '## [$v]' section" >&2; exit 1; }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "$TAG" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
